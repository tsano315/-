

<!DOCTYPE html>

<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>檍神社 小戸池の龍のAR</title>

  <script type="module"

    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.1.0/model-viewer.min.js">

  </script>

  <style>

    body { margin: 0; background: #eaf4ff; }

    model-viewer {

      width: 100vw;

      height: 100dvh;

    }

  </style>

</head>

<body>

  <model-viewer

    

    src="./Aoki_Dragon_v12_Eye_Contour_Surface_Test(3).glb"
    
  

    alt="檍神社 小戸池の龍"

    camera-controls

    auto-rotate

    shadow-intensity="1"
    
    id="dragon"

    ar

    ar-modes="quick-look webxr scene-viewer"

    ar-scale="auto">

  </model-viewer>

</body>

</html>
